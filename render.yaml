services:
  - type: web
    name: uaoa-i18n-review-api
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: python3 api/server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: jhendri4/uaoa-i18n-review
      - key: GITHUB_BRANCH
        value: main
