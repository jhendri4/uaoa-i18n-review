<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UAOA Translation Review</title>
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>UAOA Translation Review</h1>
      <p>English left · translation right · approve to lock</p>
    </div>
    <div class="header-controls">
      <label>
        Locale
        <select id="localeSelect" aria-label="Locale"></select>
      </label>
      <span class="pill" id="reviewerPill">Reviewer…</span>
      <span class="pill" id="lockPill">Lock…</span>
      <button type="button" class="btn btn-ghost btn-checkout" id="checkoutBtn" hidden aria-label="Check out locale">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
        </svg>
        <span>Check out</span>
      </button>
      <button type="button" class="btn btn-ghost btn-release" id="releaseBtn" hidden aria-label="Release locale">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 11V8a4 4 0 0 1 7.5-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
        </svg>
        <span>Release</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Modules</h2>
      <div class="mod-list" id="modList"></div>
      <p class="sidebar-note">Leave markup like <code>&lt;strong&gt;</code> or <code>{n}</code> untouched in translations.</p>
    </aside>
    <main class="main">
      <div id="statusBanner" class="banner" hidden></div>
      <div class="toolbar">
        <div class="stats" id="stats"></div>
        <input class="search" id="search" type="search" placeholder="Filter keys or text…" autocomplete="off">
      </div>
      <div id="rows"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="nameModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
      <h2 id="nameTitle">Who’s reviewing?</h2>
      <p>Enter your name so we can check out a locale for you and record approvals. No account required.</p>
      <input id="nameInput" type="text" maxlength="80" placeholder="Your name" autocomplete="name">
      <div class="row-actions">
        <button type="button" class="btn btn-approve" id="nameStart">Start reviewing</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="config.js?v=24"></script>
  <script src="app.js?v=24"></script>
</body>
</html>
